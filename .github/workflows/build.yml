name: Build package

on:
  workflow_dispatch:
    inputs:
      web_tag:
        description: 'jellyfin-web tag to build (default: latest release)'
        required: false
        default: ''
        type: string
      publish_npm:
        description: 'Also publish to npm'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      web_tag:
        required: true
        type: string
      publish_npm:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve jellyfin-web tag
        id: resolve
        run: |
          TAG="${{ inputs.web_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="$(curl -sS https://api.github.com/repos/jellyfin/jellyfin-web/releases/latest | jq -r .tag_name)"
          fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "could not resolve a jellyfin-web tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building jellyfin-web ${TAG}"

      - name: Determine required Node.js version
        id: node_for_web
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          PKG_URL="https://raw.githubusercontent.com/jellyfin/jellyfin-web/${TAG}/package.json"

          PKG_JSON="$(curl -sSf "${PKG_URL}")" || {
            echo "ERROR: could not fetch package.json for jellyfin-web ${TAG} from ${PKG_URL}" >&2
            exit 1
          }

          NPM_ENGINE="$(echo "${PKG_JSON}" | jq -r '.engines.npm // empty')"
          if [ -z "${NPM_ENGINE}" ]; then
            echo "ERROR: jellyfin-web ${TAG} package.json has no engines.npm field, refusing to guess a Node version" >&2
            exit 1
          fi

          # Extract the major version from an upper-bound clause like "<11.0.0", if present.
          # The `|| true` prevents pipefail from killing the script when there is no upper bound at all.
          UPPER_MAJOR="$(echo "${NPM_ENGINE}" | grep -oE '<[0-9]+' | head -n1 | tr -d '<' || true)"

          # An upper bound at or below npm major 11 (e.g. "<11.0.0") excludes npm 11.x,
          # which node 24 ships. Node 22 ships npm 10.x, which satisfies that bound.
          # No upper bound, or a bound above 11, means npm 11.x is required, which node 24 ships.
          if [ -n "${UPPER_MAJOR}" ] && [ "${UPPER_MAJOR}" -le 11 ]; then
            NODE_VERSION=22
          else
            NODE_VERSION=24
          fi

          echo "jellyfin-web ${TAG} requires npm ${NPM_ENGINE} -> selecting Node.js ${NODE_VERSION}"
          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dev dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Switch Node.js to the version jellyfin-web requires
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_for_web.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Build package
        env:
          PACKAGE_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          # Strip a leading v so the npm version stays semver-clean.
          export PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          ./scripts/build.sh "${{ steps.resolve.outputs.tag }}"

      - name: Verify metadata against the built package
        env:
          # Without this, the metadata tests use it.skipIf(...) and silently
          # skip when dist-build/ is missing, giving a false-green CI gate.
          # Setting it here (after the build) forces them to fail loudly
          # instead of skipping if the package metadata is somehow absent.
          REQUIRE_DIST_BUILD: 1
        run: npx vitest run test/package-metadata.test.js

      - name: Push to dist branch
        run: |
          cd dist-build
          git init -q

          # `git init` here creates a brand new, separate repo, it does not
          # inherit any identity set in the checked-out main repo above it.
          # The identity must be configured inside this new repo, not
          # --global, so it stays scoped to this throwaway dist checkout.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -q -b dist
          git add -A
          git commit -q -m "build: jellyfin-web ${{ steps.resolve.outputs.tag }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            dist

      - name: Record the built version
        run: |
          # This step commits to the checked-out main repo, which is a
          # separate repo from the dist-build/ checkout above and needs its
          # own identity here too.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          jq --arg tag "${{ steps.resolve.outputs.tag }}" \
            '.lastBuiltWebTag = $tag' versions.json > versions.tmp
          mv versions.tmp versions.json

          git add versions.json
          if git diff --cached --quiet; then
            echo "versions.json unchanged, nothing to record"
          else
            git commit -m "chore: 🔧 record built jellyfin-web ${{ steps.resolve.outputs.tag }}"
            git push
          fi

      - name: Publish to npm
        if: inputs.publish_npm
        working-directory: dist-build
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
