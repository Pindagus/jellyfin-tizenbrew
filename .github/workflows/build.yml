name: Build and release

# semantic-release decides everything about the version: it reads the commit
# history since the last release and maps conventional-commit types onto a bump
# (fix -> patch, feat -> minor, ! or BREAKING CHANGE -> major). Landing on dev
# publishes a prerelease to the npm "dev" dist-tag; landing on main publishes a
# release to "latest" and opens a GitHub Release with generated notes.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      web_tag:
        description: 'jellyfin-web tag to build (default: the pin in versions.json)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and verify without publishing anything'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  # npm trusted publishing swaps this short-lived OIDC token for publish rights,
  # so no long-lived NPM_TOKEN secret has to exist in this repository.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release reads the commit history to work out the bump, and
          # the default shallow clone hides all but the newest commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve jellyfin-web tag
        id: resolve
        run: |
          # versions.json is the pin, so rebuilding an old release reproduces
          # what that release shipped rather than picking up whatever is newest.
          # The input only overrides it for trying a version out by hand.
          TAG="${{ inputs.web_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="$(jq -r '.jellyfinWeb // empty' versions.json)"
          fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "could not resolve a jellyfin-web tag from versions.json" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building jellyfin-web ${TAG}"

      - name: Determine required Node.js version
        id: node_for_web
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          PKG_URL="https://raw.githubusercontent.com/jellyfin/jellyfin-web/${TAG}/package.json"

          PKG_JSON="$(curl -sSf "${PKG_URL}")" || {
            echo "ERROR: could not fetch package.json for jellyfin-web ${TAG} from ${PKG_URL}" >&2
            exit 1
          }

          NPM_ENGINE="$(echo "${PKG_JSON}" | jq -r '.engines.npm // empty')"
          if [ -z "${NPM_ENGINE}" ]; then
            echo "ERROR: jellyfin-web ${TAG} package.json has no engines.npm field, refusing to guess a Node version" >&2
            exit 1
          fi

          # Extract the major version from an upper-bound clause like "<11.0.0", if present.
          # The `|| true` prevents pipefail from killing the script when there is no upper bound at all.
          UPPER_MAJOR="$(echo "${NPM_ENGINE}" | grep -oE '<[0-9]+' | head -n1 | tr -d '<' || true)"

          # An upper bound at or below npm major 11 (e.g. "<11.0.0") excludes npm 11.x,
          # which node 24 ships. Node 22 ships npm 10.x, which satisfies that bound.
          # No upper bound, or a bound above 11, means npm 11.x is required, which node 24 ships.
          if [ -n "${UPPER_MAJOR}" ] && [ "${UPPER_MAJOR}" -le 11 ]; then
            NODE_VERSION=22
          else
            NODE_VERSION=24
          fi

          echo "jellyfin-web ${TAG} requires npm ${NPM_ENGINE} -> selecting Node.js ${NODE_VERSION}"
          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dev dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Switch Node.js to the version jellyfin-web requires
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_for_web.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Build package
        env:
          PACKAGE_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          # Strip a leading v so the npm version stays semver-clean.
          export PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          ./scripts/build.sh "${{ steps.resolve.outputs.tag }}"

      - name: Verify metadata against the built package
        env:
          # Without this, the metadata tests use it.skipIf(...) and silently
          # skip when dist-build/ is missing, giving a false-green CI gate.
          # Setting it here (after the build) forces them to fail loudly
          # instead of skipping if the package metadata is somehow absent.
          REQUIRE_DIST_BUILD: 1
        run: npx vitest run test/package-metadata.test.js

      - name: Release
        id: release
        if: inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No NPM_TOKEN: authentication comes from the OIDC token the id-token
          # permission grants, matched against the trusted publisher configured
          # on the package (owner, repo and this workflow's filename).
          #
          # This is also the step that decides whether anything gets published
          # at all. A run whose commits carry no releasable type (docs, chore,
          # style) ends here without a release, which is the intended outcome
          # rather than a failure.
          npx semantic-release

          # The purge step needs to know whether anything was actually
          # published, and on which dist-tag. Reading it back from the manifest
          # semantic-release just wrote is more reliable than parsing its log.
          if [ -f dist-build/package.json ]; then
            PUBLISHED="$(jq -r '.version' dist-build/package.json)"
            if [ "${PUBLISHED}" != "0.0.0-local" ] && [ -n "${PUBLISHED}" ]; then
              echo "version=${PUBLISHED}" >> "$GITHUB_OUTPUT"
              case "${PUBLISHED}" in
                *-dev.*) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
                *)       echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
              esac
            fi
          fi

      # jsDelivr caches a dist-tag on its edge for 12 hours, because the tag can
      # move. TizenBrew fetches modules straight from jsDelivr and caches nothing
      # itself, so without this a TV installing @dev keeps getting the previous
      # build for up to half a day. Pinned versions are immutable and unaffected.
      #
      # Only the files this project actually changes are purged: www/ carries the
      # jellyfin-web build, and jsDelivr purges per file, so listing all 1218
      # would be slow and pointless. One request covers the whole list.
      #
      # continue-on-error because the package is already published by this point.
      # A failed purge means a slow rollout, never a failed release.
      - name: Refresh the jsDelivr cache for the published tag
        if: inputs.dry_run != true && steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          PKG="@pindagus/jellyfin-tizenbrew"
          PATHS="$(printf '"/npm/%s@%s/%s",' \
            "${PKG}" "${TAG}" "package.json" \
            "${PKG}" "${TAG}" "tizen-adapter.js" \
            "${PKG}" "${TAG}" "tizen.js" \
            "${PKG}" "${TAG}" "index.html" \
            "${PKG}" "${TAG}" "README.md" \
            "${PKG}" "${TAG}" "www/index.html" | sed 's/,$//')"

          RESPONSE="$(curl -sS -X POST "https://purge.jsdelivr.net/" \
            -H "Content-Type: application/json" \
            -d "{\"path\":[${PATHS}]}")"

          echo "${RESPONSE}"

          # A purge is queued, not instant, so report the outcome rather than
          # assuming it worked: a throttled request still returns an id.
          PURGE_ID="$(echo "${RESPONSE}" | jq -r '.id // empty')"
          if [ -z "${PURGE_ID}" ]; then
            echo "::warning::jsDelivr did not accept the purge; @${TAG} will refresh on its own within 12 hours"
            exit 0
          fi

          for _ in $(seq 1 20); do
            STATUS="$(curl -sS "https://purge.jsdelivr.net/status/${PURGE_ID}" | jq -r '.status // empty')"
            [ "${STATUS}" = "finished" ] && break
            sleep 3
          done

          if [ "${STATUS}" = "finished" ]; then
            echo "jsDelivr now serves ${{ steps.release.outputs.version }} on @${TAG}"
          else
            echo "::warning::purge ${PURGE_ID} still ${STATUS:-unknown}; @${TAG} will refresh on its own within 12 hours"
          fi

      - name: Report what a release would do
        if: inputs.dry_run == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run
